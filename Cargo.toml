[package]
name = "monsgeek-linux"
version = "0.1.0"
edition = "2024"
description = "Experimental original MonsGeek M1W USB configurator"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
libc = "0.2"

[workspace]
members = ["gui"]
